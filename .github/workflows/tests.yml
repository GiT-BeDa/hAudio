name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev-tested.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev-tested.txt
      - name: Compile Python
        run: python -m compileall -q opt/haudio
      - name: Lint Python
        run: ruff check opt tests
      - name: Type-check backend
        run: mypy opt/haudio/haudio
      - name: Run backend tests
        run: pytest --cov=opt/haudio/haudio --cov-report=term-missing --cov-fail-under=55 -q
      - name: Verify distribution checksums
        run: sha256sum -c SHA256SUMS

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend test dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: node --check opt/haudio/frontend/app.js
      - name: Run frontend DOM tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser tests
        run: npm run test:e2e
