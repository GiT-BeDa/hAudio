name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev-tested.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev-tested.txt
      - name: Compile Python
        run: python -m compileall -q opt/haudio
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check opt/haudio/frontend/app.js
      - name: Run frontend DOM tests
        run: node --test tests/frontend.test.js
